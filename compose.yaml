services:
  jekyll:
    image: jvconseil/jekyll-docker
    ports:
      - "4000:4000"
    # The image's default gem path is /usr/gem, so a volume mounted at
    # /usr/local/bundle caches nothing unless bundler is pointed at it.
    environment:
      BUNDLE_PATH: /usr/local/bundle
      GEM_HOME: /usr/local/bundle
    volumes:
      - .:/srv/jekyll:Z
      - bundle-cache:/usr/local/bundle
    # build-base supplies the C toolchain the native gems (nokogiri,
    # strscan, ...) need; the base image ships without it. --host 0.0.0.0
    # is required for the published port to be reachable from the host.
    command: >
      sh -c "apk add --no-cache build-base &&
             bundle install &&
             bundle exec jekyll serve --host 0.0.0.0 --config _config.yml,_config-dev.yml"

volumes:
  bundle-cache:
